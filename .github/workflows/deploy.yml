name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check, build, Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # CI machines have no GPU: WebGL runs on SwiftShader, the game picks its
      # low graphics preset, and the load test asserts render/memory budgets
      # but not frame times.
      - name: Playwright tests (visual, features, bot playtest, campaign, load test)
        run: npx playwright test
        env:
          CI: '1'
          # no GPU on the runner: allow Chromium's SwiftShader WebGL (refused by default since Chrome 137)
          SOFTWARE_GL: '1'

      - name: Upload test report and metrics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            artifacts/perf-metrics.json
            artifacts/bot-metrics.json
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # vite.config.ts uses base './', so the build works under /<repo>/ as-is
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
